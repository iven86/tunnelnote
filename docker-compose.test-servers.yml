version: '3.8'

services:
  ssh-test-server:
    image: linuxserver/openssh-server:latest
    container_name: tunnelnote-test-ssh
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
      - SUDO_ACCESS=true
      - PASSWORD_ACCESS=true
      - LOG_STDOUT=true
    volumes:
      - /tmp/tunnelnote-ssh-config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2222"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Add SFTP test server with known data
  sftp-test-data:
    image: atmoz/sftp:latest
    container_name: tunnelnote-test-sftp
    ports:
      - "2223:22"
    command: testuser:testpass:1001
    volumes:
      - /tmp/tunnelnote-sftp-data:/home/testuser/share
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 5
