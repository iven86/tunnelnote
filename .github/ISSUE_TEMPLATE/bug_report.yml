name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce and what you expected. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: TunnelNote version }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations: { required: true }
  - type: markdown
    attributes:
      value: Never paste passwords, private keys or vault files. Report security issues privately (see SECURITY.md).
